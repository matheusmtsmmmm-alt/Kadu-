<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var _err = console.error;
        var _warn = console.warn;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
            return;
          }
          _err.apply(console, arguments);
        };
        console.warn = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
            return;
          }
          _warn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('[vite]') !== -1 || e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('websocket') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
